<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Multiplayer</title>

    <script src="/navbar.js" defer></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main>
        <h1>Dice Multiplayer</h1>
        <label for="username">Name:</label> 
            <input 
            type="text" 
            id="username" 
            placeholder="Enter username">
        <div class="lobby-box">
            <button onclick="alert('suyashi')">
                Create Lobby
            </button>
        <div>
        <div class="lobby-box">
            <label for="lobbyid">Lobby ID:</label>
            <input 
            type="number" 
            id="lobbyid" 
            placeholder="Enter lobby code">

            <button onclick="alert('suyashi')">
                Join Lobby
            </button>
        <div>

        <p id="lobbyStatus"></p>
        
    </main>

    <script src="dicemultiplayer.js"></script>
    
</body>
</html>
